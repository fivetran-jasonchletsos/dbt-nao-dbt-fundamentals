version: 2

models:
  - name: dim_customers
    description: "{{ doc('dim_customers_desc') }}"
    columns:
      - name: customer_id
        description: Primary key for customers.
        tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order_date
        description: Date of customer's first order.
      - name: most_recent_order_date
        description: Date of customer's most recent order.
      - name: number_of_orders
        description: Count of orders placed by the customer.
      - name: lifetime_value
        description: Total amount spent by the customer across all orders.

  - name: fct_orders
    description: "{{ doc('fct_orders_desc') }}"
    columns:
      - name: order_id
        description: Primary key for orders.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to dim_customers.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: "{{ doc('order_status') }}"
      - name: amount
        description: Total amount of the order in dollars.